<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M6ANIME</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0b0b0b;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    header {
        text-align: center;
        padding: 35px 15px 20px;
    }

    .logo {
        color: #ff1493;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 25px;
    }

    .search-area {
        display: flex;
        justify-content: center;
        gap: 10px;
        max-width: 750px;
        margin: auto;
    }

    #searchInput {
        flex: 1;
        padding: 16px 18px;
        border-radius: 12px;
        border: 2px solid #333;
        background: #171717;
        color: white;
        font-size: 17px;
        outline: none;
    }

    #searchInput:focus {
        border-color: #ff1493;
    }

    button {
        cursor: pointer;
        border: none;
        font-weight: bold;
    }

    #searchBtn {
        background: #ff1493;
        color: white;
        padding: 0 25px;
        border-radius: 12px;
        font-size: 16px;
    }

    #searchBtn:hover {
        background: #ff0080;
    }

    main {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
    }

    h2 {
        color: #ff1493;
        font-size: 32px;
        margin-top: 35px;
    }

    .status {
        text-align: center;
        color: #aaa;
        padding: 30px;
        font-size: 18px;
    }

    .anime-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 20px;
    }

    .anime-card {
        background: #161616;
        border: 1px solid #292929;
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
    }

    .anime-card:hover {
        transform: translateY(-5px);
        border-color: #ff1493;
    }

    .anime-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
    }

    .anime-info {
        padding: 12px;
    }

    .anime-title {
        font-size: 17px;
        font-weight: bold;
        line-height: 1.3;
    }

    .anime-meta {
        color: #999;
        margin-top: 8px;
        font-size: 14px;
    }

    #details {
        display: none;
        margin-top: 30px;
    }

    .back-btn {
        background: #222;
        color: white;
        border: 1px solid #444;
        padding: 12px 18px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 15px;
    }

    .back-btn:hover {
        border-color: #ff1493;
    }

    .details-card {
        background: #111;
        border: 1px solid #292929;
        border-radius: 16px;
        padding: 20px;
    }

    .details-top {
        display: flex;
        gap: 25px;
        align-items: flex-start;
    }

    .details-poster {
        width: 230px;
        max-width: 40%;
        border-radius: 12px;
    }

    .details-info {
        flex: 1;
    }

    .details-title {
        font-size: 36px;
        font-weight: 900;
        margin: 0 0 15px;
    }

    .details-line {
        color: #ccc;
        margin: 9px 0;
        font-size: 16px;
    }

    .details-line strong {
        color: white;
    }

    .synopsis {
        margin-top: 25px;
        color: #ddd;
        line-height: 1.7;
        font-size: 16px;
    }

    .genres {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 15px;
    }

    .genre {
        background: #222;
        border-radius: 10px;
        padding: 10px 16px;
        color: #eee;
    }

    /* PLAYER */

    .player-section {
        margin-top: 35px;
    }

    .player-box {
        background: #111;
        border: 1px solid #303030;
        border-radius: 18px;
        overflow: hidden;
    }

    .player-header {
        padding: 20px;
        border-bottom: 1px solid #303030;
    }

    .player-title {
        font-size: 22px;
        font-weight: bold;
    }

    .player-subtitle {
        color: #888;
        margin-top: 7px;
    }

    #videoPlayer {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        background: black;
    }

    .player-message {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: black;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #999;
        padding: 30px;
        font-size: 18px;
    }

    .player-controls {
        display: flex;
        gap: 15px;
        padding: 18px;
    }

    .player-btn {
        background: #ff1493;
        color: white;
        padding: 15px 25px;
        border-radius: 12px;
        font-size: 16px;
    }

    .player-btn:hover {
        background: #ff0080;
    }

    .player-btn:disabled {
        background: #333;
        color: #777;
        cursor: not-allowed;
    }

    /* SERIES */

    .series-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .series-item {
        background: #171717;
        border: 1px solid #333;
        border-radius: 14px;
        padding: 20px;
        cursor: pointer;
    }

    .series-item:hover {
        border-color: #ff1493;
    }

    .series-item.current {
        background: #ff1493;
        border-color: #ff1493;
    }

    .series-name {
        font-size: 20px;
        font-weight: bold;
    }

    .series-meta {
        color: #999;
        margin-top: 7px;
    }

    .series-item.current .series-meta {
        color: white;
    }

    /* EPISODES */

    .episode-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
    }

    .episode-card {
        background: #171717;
        border: 1px solid #303030;
        border-radius: 12px;
        padding: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    .episode-card:hover {
        border-color: #ff1493;
        transform: translateY(-2px);
    }

    .episode-card.active {
        border-color: #ff1493;
        background: #24101d;
    }

    .episode-number {
        color: #ff1493;
        font-size: 18px;
        font-weight: bold;
    }

    .episode-title {
        margin-top: 7px;
        font-size: 16px;
        font-weight: bold;
    }

    .episode-date {
        color: #888;
        margin-top: 7px;
        font-size: 13px;
    }

    .play-label {
        color: #ff1493;
        margin-top: 10px;
        font-weight: bold;
    }

    .load-more {
        display: block;
        margin: 25px auto;
        background: #ff1493;
        color: white;
        padding: 15px 30px;
        border-radius: 12px;
        font-size: 16px;
    }

    .load-more:disabled {
        background: #333;
        color: #777;
        cursor: not-allowed;
    }

    .episode-status {
        text-align: center;
        color: #999;
        padding: 20px;
    }

    .error {
        color: #ff7777;
        text-align: center;
        padding: 20px;
    }

    .hidden {
        display: none !important;
    }

    @media (max-width: 700px) {

        .logo {
            font-size: 38px;
        }

        .search-area {
            flex-direction: column;
        }

        #searchBtn {
            padding: 15px;
        }

        .details-top {
            flex-direction: column;
        }

        .details-poster {
            max-width: 100%;
            width: 200px;
        }

        .details-title {
            font-size: 28px;
        }

        .anime-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .anime-card img {
            height: 230px;
        }

        .episode-grid {
            grid-template-columns: 1fr;
        }

        .player-controls {
            flex-direction: column;
        }
    }
</style>
</head>

<body>

<header>

    <div class="logo">M6ANIME</div>

    <div class="search-area">

        <input
            id="searchInput"
            type="text"
            placeholder="Search anime..."
            autocomplete="off"
        >

        <button id="searchBtn">Search</button>

    </div>

</header>


<main>

    <!-- HOME -->

    <section id="home">

        <h2>Popular Anime</h2>

        <div id="animeGrid" class="anime-grid"></div>

        <div id="homeStatus" class="status">
            Loading anime...
        </div>

    </section>


    <!-- DETAILS -->

    <section id="details">

        <button class="back-btn" onclick="goHome()">
            ← Back to Anime
        </button>

        <div class="details-card">

            <div class="details-top">

                <img
                    id="detailsPoster"
                    class="details-poster"
                    src=""
                    alt="Anime poster"
                >

                <div class="details-info">

                    <div
                        id="detailsTitle"
                        class="details-title">
                    </div>

                    <div class="details-line">
                        <strong>Score:</strong>
                        <span id="detailsScore"></span>
                    </div>

                    <div class="details-line">
                        <strong>Type:</strong>
                        <span id="detailsType"></span>
                    </div>

                    <div class="details-line">
                        <strong>Episodes:</strong>
                        <span id="detailsEpisodes"></span>
                    </div>

                    <div class="details-line">
                        <strong>Status:</strong>
                        <span id="detailsStatus"></span>
                    </div>

                    <div class="details-line">
                        <strong>Year:</strong>
                        <span id="detailsYear"></span>
                    </div>

                    <div class="details-line">
                        <strong>Studio:</strong>
                        <span id="detailsStudio"></span>
                    </div>

                    <div class="details-line">
                        <strong>Sub:</strong>
                        <span id="detailsSub"></span>
                    </div>

                    <div class="details-line">
                        <strong>Dub:</strong>
                        <span id="detailsDub"></span>
                    </div>

                </div>

            </div>


            <div class="synopsis">

                <h2>Synopsis</h2>

                <p id="detailsSynopsis">
                    Loading...
                </p>

            </div>


            <div>

                <h2>Genres</h2>

                <div
                    id="genreList"
                    class="genres">
                </div>

            </div>


            <!-- M6 PLAYER -->

            <div class="player-section">

                <h2>M6 Player</h2>

                <div class="player-box">

                    <div class="player-header">

                        <div
                            id="playerTitle"
                            class="player-title">
                            Select an episode
                        </div>

                        <div class="player-subtitle">
                            M6 Player
                        </div>

                    </div>


                    <div id="playerArea">

                        <div class="player-message">

                            <div>

                                <div style="font-size:22px;">
                                    Select an episode below.
                                </div>

                                <div style="margin-top:12px;">
                                    Add your own authorized video
                                    source to play it here.
                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="player-controls">

                        <button
                            id="prevBtn"
                            class="player-btn"
                            onclick="previousEpisode()"
                            disabled>
                            ⏮ Previous
                        </button>

                        <button
                            id="nextBtn"
                            class="player-btn"
                            onclick="nextEpisode()"
                            disabled>
                            Next ⏭
                        </button>

                    </div>

                </div>

            </div>


            <!-- SERIES -->

            <div>

                <h2>Series / Seasons</h2>

                <div
                    id="seriesList"
                    class="series-list">
                </div>

            </div>


            <!-- EPISODES -->

            <div>

                <h2>Episodes</h2>

                <div
                    id="episodeStatus"
                    class="episode-status">
                    Loading episodes...
                </div>

                <div
                    id="episodeGrid"
                    class="episode-grid">
                </div>

                <button
                    id="loadMoreBtn"
                    class="load-more hidden"
                    onclick="loadMoreEpisodes()">
                    Load More Episodes
                </button>

            </div>

        </div>

    </section>

</main>


<script>

/*
===========================================================
M6ANIME
===========================================================

Jikan provides anime information and episode metadata.

The M6 Player only plays video URLs that YOU are authorized
to use.

Example:

const VIDEO_SOURCES = {
    "anime-mal-id": {
        "1": "YOUR_AUTHORIZED_VIDEO_URL.mp4"
    }
};

Leave it empty until you have videos you own or have
permission to stream.

===========================================================
*/

const API = "https://api.jikan.moe/v4";


/* YOUR AUTHORIZED VIDEO SOURCES */

const VIDEO_SOURCES = {
    /*
        Example:

        "52991": {
            "1": "https://your-server.example/video1.mp4",
            "2": "https://your-server.example/video2.mp4"
        }

    */
};


/* GLOBAL VARIABLES */

let currentAnime = null;

let episodes = [];

let currentEpisodeIndex = -1;

let currentEpisodePage = 1;

let totalEpisodes = 0;

let loadingEpisodes = false;


/* ELEMENTS */

const home = document.getElementById("home");

const details = document.getElementById("details");

const animeGrid = document.getElementById("animeGrid");

const homeStatus = document.getElementById("homeStatus");

const searchInput = document.getElementById("searchInput");

const searchBtn = document.getElementById("searchBtn");


/* SEARCH */

searchBtn.addEventListener("click", searchAnime);

searchInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        searchAnime();
    }

});


async function searchAnime() {

    const query = searchInput.value.trim();

    if (!query) {
        loadPopular();
        return;
    }

    homeStatus.textContent = "Searching...";

    animeGrid.innerHTML = "";

    try {

        const response = await fetch(
            API + "/anime?q=" +
            encodeURIComponent(query) +
            "&limit=24"
        );

        if (!response.ok) {
            throw new Error("Search request failed");
        }

        const result = await response.json();

        displayAnime(result.data || []);

        if (!result.data || result.data.length === 0) {

            homeStatus.textContent =
                "No anime found.";

        } else {

            homeStatus.textContent =
                result.data.length + " anime found.";

        }

    } catch (error) {

        console.error(error);

        homeStatus.textContent =
            "Could not search right now. Please try again.";

    }

}


/* POPULAR ANIME */

async function loadPopular() {

    homeStatus.textContent = "Loading anime...";

    animeGrid.innerHTML = "";

    try {

        const response = await fetch(
            API + "/top/anime?limit=24"
        );

        if (!response.ok) {
            throw new Error("Popular anime request failed");
        }

        const result = await response.json();

        displayAnime(result.data || []);

        homeStatus.textContent = "";

    } catch (error) {

        console.error(error);

        homeStatus.textContent =
            "Could not load anime. Refresh and try again.";

    }

}


/* DISPLAY ANIME */

function displayAnime(animeList) {

    animeGrid.innerHTML = "";

    animeList.forEach(anime => {

        const card = document.createElement("div");

        card.className = "anime-card";

        const image =
            anime.images?.jpg?.large_image_url ||
            anime.images?.jpg?.image_url ||
            "";

        const title =
            anime.title ||
            "Unknown Anime";

        const score =
            anime.score ??
            "N/A";

        const year =
            anime.year ||
            anime.aired?.prop?.from?.year ||
            "Unknown";

        card.innerHTML = `

            <img
                src="${image}"
                alt="${escapeHTML(title)}"
                loading="lazy"
            >

            <div class="anime-info">

                <div class="anime-title">
                    ${escapeHTML(title)}
                </div>

                <div class="anime-meta">
                    ⭐ ${score}
                    &nbsp; • &nbsp;
                    ${year}
                </div>

            </div>
        `;

        card.addEventListener("click", function() {

            openAnime(anime.mal_id);

        });

        animeGrid.appendChild(card);

    });

}


/* OPEN ANIME */

async function openAnime(id) {

    home.style.display = "none";

    details.style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    resetAnimePage();

    document.getElementById("detailsTitle").textContent =
        "Loading...";

    try {

        const response = await fetch(
            API + "/anime/" + id + "/full"
        );

        if (!response.ok) {
            throw new Error("Anime details failed");
        }

        const result = await response.json();

        currentAnime = result.data;

        displayDetails(currentAnime);

        await loadEpisodes(true);

    } catch (error) {

        console.error(error);

        document.getElementById("detailsTitle").textContent =
            "Could not load anime.";

        document.getElementById("episodeStatus").textContent =
            "Could not load anime information.";

    }

}


/* DISPLAY DETAILS */

function displayDetails(anime) {

    document.getElementById("detailsPoster").src =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        "";

    document.getElementById("detailsTitle").textContent =
        anime.title || "Unknown";

    document.getElementById("detailsScore").textContent =
        anime.score ?? "N/A";

    document.getElementById("detailsType").textContent =
        anime.type || "Unknown";

    document.getElementById("detailsEpisodes").textContent =
        anime.episodes ?? "Unknown";

    document.getElementById("detailsStatus").textContent =
        anime.status || "Unknown";

    document.getElementById("detailsYear").textContent =
        anime.year ||
        anime.aired?.prop?.from?.year ||
        "Unknown";

    const studios = anime.studios || [];

    document.getElementById("detailsStudio").textContent =
        studios.length
            ? studios.map(x => x.name).join(", ")
            : "Unknown";


    /*
        Jikan/MAL data does not guarantee that every anime has
        a verified sub/dub flag, so we don't invent one.
    */

    document.getElementById("detailsSub").textContent =
        "Check official release";

    document.getElementById("detailsDub").textContent =
        "Check official release";


    document.getElementById("detailsSynopsis").textContent =
        anime.synopsis ||
        "No synopsis available.";


    /* GENRES */

    const genreList =
        document.getElementById("genreList");

    genreList.innerHTML = "";

    const genres = anime.genres || [];

    genres.forEach(genre => {

        const item = document.createElement("div");

        item.className = "genre";

        item.textContent = genre.name;

        genreList.appendChild(item);

    });


    /* SERIES */

    displaySeries(anime);

}


/* SERIES / SEASONS */

function displaySeries(anime) {

    const seriesList =
        document.getElementById("seriesList");

    seriesList.innerHTML = "";


    /* CURRENT ANIME */

    const current = document.createElement("div");

    current.className = "series-item current";

    current.innerHTML = `

        <div class="series-name">
            ${escapeHTML(anime.title || "Current Anime")}
        </div>

        <div class="series-meta">
            ${escapeHTML(anime.season || "")}
            ${anime.year ? " " + anime.year : ""}
            ${anime.type ? " • " + anime.type : ""}
        </div>

    `;

    seriesList.appendChild(current);


    /*
        Relations from Jikan.
        We display them without inventing season numbers.
    */

    const relations = anime.relations || [];

    relations.forEach(relation => {

        if (!relation.entry || !relation.entry.length) {
            return;
        }

        relation.entry.forEach(entry => {

            if (entry.type !== "anime") {
                return;
            }

            const item =
                document.createElement("div");

            item.className = "series-item";

            item.innerHTML = `

                <div class="series-name">
                    ${escapeHTML(entry.name)}
                </div>

                <div class="series-meta">
                    ${escapeHTML(relation.relation)}
                    • anime
                </div>

            `;

            item.addEventListener("click", function() {

                openAnime(entry.mal_id);

            });

            seriesList.appendChild(item);

        });

    });

}


/* RESET */

function resetAnimePage() {

    episodes = [];

    currentEpisodeIndex = -1;

    currentEpisodePage = 1;

    totalEpisodes = 0;

    loadingEpisodes = false;

    document.getElementById("episodeGrid").innerHTML = "";

    document.getElementById("episodeStatus").textContent =
        "Loading episodes...";

    document.getElementById("loadMoreBtn").classList.add(
        "hidden"
    );

    document.getElementById("playerTitle").textContent =
        "Select an episode";

    document.getElementById("playerArea").innerHTML = `

        <div class="player-message">

            <div>

                <div style="font-size:22px;">
                    Select an episode below.
                </div>

                <div style="margin-top:12px;">
                    Add your own authorized video
                    source to play it here.
                </div>

            </div>

        </div>

    `;

    updatePlayerButtons();

}


/* LOAD EPISODES */

async function loadEpisodes(firstLoad = false) {

    if (!currentAnime || loadingEpisodes) {
        return;
    }

    loadingEpisodes = true;


    if (firstLoad) {

        currentEpisodePage = 1;

        episodes = [];

        document.getElementById("episodeGrid").innerHTML = "";

        document.getElementById("episodeStatus").textContent =
            "Loading episodes...";

    }


    try {

        const url =
            API +
            "/anime/" +
            currentAnime.mal_id +
            "/episodes?page=" +
            currentEpisodePage;


        const response = await fetch(url);


        /*
            Jikan can temporarily rate-limit requests.
        */

        if (response.status === 429) {

            document.getElementById("episodeStatus").textContent =
                "Jikan is rate-limiting the request. Please wait a few seconds and try again.";

            loadingEpisodes = false;

            return;
        }


        if (!response.ok) {
            throw new Error(
                "Episode request failed: " +
                response.status
            );
        }


        const result = await response.json();

        const newEpisodes =
            result.data || [];


        /*
            Avoid duplicates.
        */

        newEpisodes.forEach(ep => {

            const exists = episodes.some(
                existing =>
                    existing.mal_id === ep.mal_id
            );

            if (!exists) {
                episodes.push(ep);
            }

        });


        totalEpisodes =
            result.pagination?.items?.total ??
            currentAnime.episodes ??
            episodes.length;


        renderEpisodes();


        const hasNext =
            result.pagination?.has_next_page === true;


        const loadMoreBtn =
            document.getElementById("loadMoreBtn");


        if (hasNext) {

            loadMoreBtn.classList.remove("hidden");

        } else {

            loadMoreBtn.classList.add("hidden");

        }


        if (episodes.length === 0) {

            document.getElementById("episodeStatus").textContent =
                "No episode data was returned.";

        }


    } catch (error) {

        console.error(error);

        document.getElementById("episodeStatus").innerHTML =
            "Could not load the episode list.<br><br>" +
            "Try refreshing the page in a few seconds.";

    }


    loadingEpisodes = false;

}


/* LOAD MORE */

async function loadMoreEpisodes() {

    if (loadingEpisodes) {
        return;
    }

    currentEpisodePage++;

    await loadEpisodes(false);

}


/* RENDER EPISODES */

function renderEpisodes() {

    const grid =
        document.getElementById("episodeGrid");

    grid.innerHTML = "";


    episodes.forEach((episode, index) => {

        const card =
            document.createElement("div");

        card.className = "episode-card";


        if (index === currentEpisodeIndex) {

            card.classList.add("active");

        }


        const number =
            episode.mal_id ??
            index + 1;


        const title =
            episode.title ||
            "Episode " + number;


        let airedDate = "";

        if (episode.aired) {

            airedDate =
                new Date(
                    episode.aired
                ).toLocaleDateString();

        }


        card.innerHTML = `

            <div class="episode-number">
                Episode ${number}
            </div>

            <div class="episode-title">
                ${escapeHTML(title)}
            </div>

            ${
                airedDate
                ?
                `<div class="episode-date">
                    Aired: ${airedDate}
                </div>`
                :
                ""
            }

            <div class="play-label">
                ▶ Play
            </div>

        `;


        card.addEventListener(
            "click",
            function() {

                selectEpisode(index);

            }
        );


        grid.appendChild(card);

    });


    document.getElementById("episodeStatus").textContent =
        episodes.length +
        " of " +
        totalEpisodes +
        " episodes loaded.";


    updatePlayerButtons();

}


/* SELECT EPISODE */

function selectEpisode(index) {

    if (
        index < 0 ||
        index >= episodes.length
    ) {
        return;
    }


    currentEpisodeIndex = index;


    const episode =
        episodes[index];


    const episodeNumber =
        episode.mal_id ??
        index + 1;


    document.getElementById("playerTitle").textContent =
        "Episode " +
        episodeNumber +
        " — " +
        (episode.title || "Untitled");


    /*
        Look for an authorized source.

        VIDEO_SOURCES uses:

        anime MAL ID
            ↓
        episode number
            ↓
        video URL
    */

    const animeSources =
        VIDEO_SOURCES[currentAnime.mal_id];


    const videoUrl =
        animeSources &&
        animeSources[String(episodeNumber)];


    const playerArea =
        document.getElementById("playerArea");


    if (videoUrl) {

        playerArea.innerHTML = `

            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata">

                <source
                    src="${escapeAttribute(videoUrl)}"
                    type="video/mp4">

                Your browser does not support video playback.

            </video>

        `;

    } else {

        playerArea.innerHTML = `

            <div class="player-message">

                <div>

                    <div style="font-size:22px;">
                        Episode ${episodeNumber}
                    </div>

                    <div style="margin-top:12px;">
                        No video source is configured
                        for this episode yet.
                    </div>

                    <div style="
                        margin-top:12px;
                        font-size:14px;
                        color:#777;
                    ">
                        The M6 Player only plays videos
                        you own or are authorized to stream.
                    </div>

                </div>

            </div>

        `;

    }


    renderEpisodes();

    updatePlayerButtons();


    /*
        Scroll to player.
    */

    document.querySelector(
        ".player-section"
    ).scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


/* PREVIOUS */

function previousEpisode() {

    if (currentEpisodeIndex <= 0) {
        return;
    }

    selectEpisode(
        currentEpisodeIndex - 1
    );

}


/* NEXT */

async function nextEpisode() {

    if (
        currentEpisodeIndex < episodes.length - 1
    ) {

        selectEpisode(
            currentEpisodeIndex + 1
        );

        return;
    }


    /*
        If we reached the end of the currently
        loaded page, try loading another page.
    */

    const before =
        episodes.length;


    if (!loadingEpisodes) {

        currentEpisodePage++;

        await loadEpisodes(false);

    }


    if (episodes.length > before) {

        selectEpisode(before);

    }

}


/* PLAYER BUTTON STATE */

function updatePlayerButtons() {

    const prev =
        document.getElementById("prevBtn");

    const next =
        document.getElementById("nextBtn");


    prev.disabled =
        currentEpisodeIndex <= 0;


    next.disabled =
        currentEpisodeIndex < 0 ||
        (
            currentEpisodeIndex >=
            episodes.length - 1 &&
            episodes.length >= totalEpisodes
        );

}


/* GO HOME */

function goHome() {

    details.style.display = "none";

    home.style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* SECURITY HELPERS */

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* START */

loadPopular();

</script>
