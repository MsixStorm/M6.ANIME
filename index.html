<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M6ANIME</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 32px 15px 20px;
        }

        .logo {
            color: #ff1493;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            max-width: 700px;
            margin: auto;
        }

        #searchInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #ff1493;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #searchButton {
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            background: #ff1493;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover {
            background: #ff3da6;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            color: #ff1493;
        }

        .status {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(165px, 1fr));
            gap: 18px;
        }

        .anime-card {
            background: #111;
            border: 1px solid #242424;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            border-color: #ff1493;
        }

        .anime-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .anime-info {
            padding: 12px;
        }

        .anime-title {
            font-weight: bold;
            line-height: 1.4;
        }

        .small-info {
            color: #999;
            font-size: 13px;
            margin-top: 7px;
        }

        .score {
            color: #ffd700;
            margin-top: 7px;
        }

        .back-button,
        .pink-button,
        .load-more,
        .watch-button {
            border: none;
            background: #ff1493;
            color: white;
            border-radius: 8px;
            padding: 11px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-button {
            margin-bottom: 20px;
        }

        .back-button:hover,
        .pink-button:hover,
        .load-more:hover,
        .watch-button:hover {
            background: #ff3da6;
        }

        .details {
            background: #101010;
            border: 1px solid #242424;
            border-radius: 15px;
            padding: 20px;
        }

        .details-top {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .details-poster {
            width: 250px;
            max-width: 100%;
            border-radius: 12px;
        }

        .details-info {
            flex: 1;
            min-width: 250px;
        }

        .details-title {
            color: #ff1493;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .meta {
            color: #ccc;
            line-height: 1.9;
        }

        .synopsis {
            color: #ddd;
            line-height: 1.7;
            margin-top: 15px;
        }

        .section {
            margin-top: 30px;
        }

        .section-title {
            color: #ff1493;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* SERIES / SEASONS */

        .season-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(210px, 1fr));
            gap: 10px;
        }

        .season-button {
            background: #171717;
            color: white;
            border: 1px solid #303030;
            padding: 13px;
            border-radius: 9px;
            cursor: pointer;
            text-align: left;
        }

        .season-button:hover {
            border-color: #ff1493;
        }

        .season-button.active {
            background: #ff1493;
            border-color: #ff1493;
        }

        .season-name {
            font-weight: bold;
        }

        .season-type {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .season-button.active .season-type {
            color: white;
        }

        /* M6 PLAYER */

        .player-box {
            background: #000;
            border: 1px solid #292929;
            border-radius: 14px;
            overflow: hidden;
        }

        .player-header {
            padding: 15px;
            background: #101010;
            border-bottom: 1px solid #282828;
        }

        .player-title {
            font-weight: bold;
            color: white;
        }

        .player-subtitle {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        #m6Video {
            width: 100%;
            max-height: 70vh;
            display: block;
            background: #000;
        }

        .player-message {
            padding: 45px 20px;
            text-align: center;
            color: #888;
        }

        .player-note {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }

        .player-controls {
            display: flex;
            gap: 10px;
            padding: 12px;
            background: #101010;
        }

        .player-controls button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* EPISODES */

        .episode-list {
            display: grid;
            gap: 10px;
        }

        .episode-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 13px;
        }

        .episode-card:hover {
            border-color: #ff1493;
        }

        .episode-number {
            min-width: 60px;
            text-align: center;
            color: #ff1493;
            font-weight: bold;
        }

        .episode-info {
            flex: 1;
        }

        .episode-title {
            font-weight: bold;
        }

        .episode-date {
            color: #777;
            font-size: 12px;
            margin-top: 6px;
        }

        .load-more {
            display: block;
            margin: 20px auto;
        }

        .empty {
            color: #777;
        }

        @media (max-width: 600px) {

            .logo {
                font-size: 38px;
            }

            .search-box {
                flex-direction: column;
            }

            #searchButton {
                width: 100%;
            }

            .anime-card img {
                height: 220px;
            }

            .details-title {
                font-size: 25px;
            }

            .episode-card {
                flex-wrap: wrap;
            }

            .watch-button {
                width: 100%;
            }

            .player-controls {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        M6ANIME
    </div>

    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="Search anime..."
        >

        <button id="searchButton">
            Search
        </button>

    </div>

</header>


<main>

    <!-- HOME -->

    <section id="homePage">

        <h2>
            Popular Anime
        </h2>

        <div
            id="animeGrid"
            class="anime-grid"
        ></div>

        <div
            id="homeStatus"
            class="status"
        >
            Loading anime...
        </div>

    </section>


    <!-- DETAILS -->

    <section
        id="detailsPage"
        style="display:none;"
    >

        <button
            id="backButton"
            class="back-button"
        >
            ← Back
        </button>

        <div id="detailsContainer"></div>

    </section>

</main>


<script>

const API =
    "https://api.jikan.moe/v4";


/*
==================================================
M6 VIDEO SOURCES
==================================================

Put ONLY videos you own or are authorized/licensed
to stream here.

Example:

const VIDEO_SOURCES = {
    123: {
        1: "https://your-server.com/video1.mp4",
        2: "https://your-server.com/video2.mp4"
    }
};

The number 123 would be the anime's MAL ID.

Leave empty until you have authorized video sources.
*/

const VIDEO_SOURCES = {};


let currentAnime = null;

let currentEpisodePage = 1;

let currentEpisodeAnimeId = null;

let loadedEpisodes = [];

let currentEpisodeIndex = -1;

let episodeLoading = false;


/* ==================================================
   ELEMENTS
================================================== */

const homePage =
    document.getElementById("homePage");

const detailsPage =
    document.getElementById("detailsPage");

const animeGrid =
    document.getElementById("animeGrid");

const homeStatus =
    document.getElementById("homeStatus");

const searchInput =
    document.getElementById("searchInput");

const searchButton =
    document.getElementById("searchButton");

const backButton =
    document.getElementById("backButton");


/* ==================================================
   HTML SAFETY
================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==================================================
   DATE
================================================== */

function formatDate(date) {

    if (!date) {
        return "Unknown";
    }

    const d =
        new Date(date);

    if (isNaN(d.getTime())) {
        return date;
    }

    return d.toLocaleDateString();
}


/* ==================================================
   API
================================================== */

async function apiFetch(url) {

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "API error: " +
            response.status
        );
    }

    return await response.json();
}


/* ==================================================
   LOAD POPULAR ANIME
================================================== */

async function loadPopularAnime() {

    animeGrid.innerHTML = "";

    homeStatus.textContent =
        "Loading 24 anime...";


    try {

        const result =
            await apiFetch(
                `${API}/top/anime?limit=24`
            );


        displayAnime(
            result.data || []
        );


        homeStatus.textContent =
            "Showing 24 anime for now.";


    } catch (error) {

        console.error(error);

        homeStatus.textContent =
            "Could not load anime. Refresh the page.";
    }
}


/* ==================================================
   DISPLAY ANIME
================================================== */

function displayAnime(animes) {

    animeGrid.innerHTML = "";


    if (!animes.length) {

        animeGrid.innerHTML =
            `<div class="empty">
                No anime found.
            </div>`;

        return;
    }


    animes.forEach(anime => {

        const card =
            document.createElement("div");


        card.className =
            "anime-card";


        const image =
            anime.images?.jpg?.large_image_url ||
            anime.images?.jpg?.image_url ||
            "";


        card.innerHTML = `

            <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(anime.title)}"
            >

            <div class="anime-info">

                <div class="anime-title">
                    ${escapeHTML(anime.title)}
                </div>

                <div class="small-info">
                    ${escapeHTML(
                        anime.type || "Unknown"
                    )}
                    •
                    ${anime.episodes ?? "?"}
                    eps
                </div>

                <div class="score">
                    ⭐ ${anime.score ?? "N/A"}
                </div>

            </div>
        `;


        card.addEventListener(
            "click",
            () => openAnime(anime.mal_id)
        );


        animeGrid.appendChild(card);
    });
}


/* ==================================================
   SEARCH
================================================== */

async function searchAnime() {

    const query =
        searchInput.value.trim();


    if (!query) {

        loadPopularAnime();

        return;
    }


    animeGrid.innerHTML = "";

    homeStatus.textContent =
        "Searching...";


    try {

        const result =
            await apiFetch(
                `${API}/anime?q=${encodeURIComponent(query)}&limit=24`
            );


        displayAnime(
            result.data || []
        );


        homeStatus.textContent =
            `Results for "${query}"`;


    } catch (error) {

        console.error(error);

        homeStatus.textContent =
            "Search failed. Please try again.";
    }
}


searchButton.addEventListener(
    "click",
    searchAnime
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            searchAnime();
        }

    }
);


/* ==================================================
   OPEN ANIME
================================================== */

async function openAnime(id) {

    homePage.style.display =
        "none";

    detailsPage.style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    document.getElementById(
        "detailsContainer"
    ).innerHTML = `

        <div class="status">
            Loading anime...
        </div>
    `;


    try {

        const result =
            await apiFetch(
                `${API}/anime/${id}/full`
            );


        currentAnime =
            result.data;


        loadedEpisodes = [];

        currentEpisodeIndex = -1;

        currentEpisodePage = 1;

        currentEpisodeAnimeId =
            id;


        renderAnimeDetails(
            currentAnime
        );


    } catch (error) {

        console.error(error);

        document.getElementById(
            "detailsContainer"
        ).innerHTML = `

            <div class="status">
                Could not load this anime.
            </div>
        `;
    }
}


/* ==================================================
   ANIME DETAILS
================================================== */

function renderAnimeDetails(anime) {

    const container =
        document.getElementById(
            "detailsContainer"
        );


    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        "";


    const studios =
        anime.studios?.length
            ? anime.studios
                .map(
                    studio =>
                        escapeHTML(
                            studio.name
                        )
                )
                .join(", ")
            : "Unknown";


    const genres =
        anime.genres?.length
            ? anime.genres
                .map(
                    genre =>
                        `<span class="badge">
                            ${escapeHTML(
                                genre.name
                            )}
                        </span>`
                )
                .join("")
            : `<span class="empty">
                    Unknown
               </span>`;


    container.innerHTML = `

        <div class="details">

            <div class="details-top">

                <img
                    class="details-poster"
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(anime.title)}"
                >


                <div class="details-info">

                    <div class="details-title">
                        ${escapeHTML(
                            anime.title
                        )}
                    </div>


                    <div class="meta">

                        <strong>Type:</strong>
                        ${escapeHTML(
                            anime.type ||
                            "Unknown"
                        )}
                        <br>

                        <strong>Episodes:</strong>
                        ${anime.episodes ??
                            "Unknown"}
                        <br>

                        <strong>Status:</strong>
                        ${escapeHTML(
                            anime.status ||
                            "Unknown"
                        )}
                        <br>

                        <strong>Season:</strong>
                        ${escapeHTML(
                            anime.season ||
                            "Unknown"
                        )}
                        ${anime.year || ""}
                        <br>

                        <strong>Score:</strong>
                        ⭐ ${anime.score ??
                            "N/A"}
                        <br>

                        <strong>Studio:</strong>
                        ${studios}

                    </div>


                    <div class="synopsis">

                        ${escapeHTML(
                            anime.synopsis ||
                            "No synopsis available."
                        )}

                    </div>


                    <div class="section">

                        <div class="section-title">
                            Genres
                        </div>

                        ${genres}

                    </div>

                </div>

            </div>


            <!-- M6 PLAYER -->

            <div class="section">

                <div class="section-title">
                    M6 Player
                </div>


                <div class="player-box">

                    <div class="player-header">

                        <div
                            id="playerTitle"
                            class="player-title"
                        >
                            Select an episode
                        </div>


                        <div
                            id="playerSubtitle"
                            class="player-subtitle"
                        >
                            M6ANIME Player
                        </div>

                    </div>


                    <video
                        id="m6Video"
                        controls
                        playsinline
                        preload="metadata"
                        style="display:none;"
                    ></video>


                    <div
                        id="playerMessage"
                        class="player-message"
                    >

                        🎬 Select an episode
                        below to use the M6 Player.

                        <div class="player-note">

                            No video is configured yet.
                            Add an authorized video source
                            to VIDEO_SOURCES when available.

                        </div>

                    </div>


                    <div class="player-controls">

                        <button
                            id="previousButton"
                            class="pink-button"
                            disabled
                        >
                            ⏮ Previous
                        </button>


                        <button
                            id="nextButton"
                            class="pink-button"
                            disabled
                        >
                            Next ⏭
                        </button>

                    </div>

                </div>

            </div>


            <!-- SERIES / SEASONS -->

            <div class="section">

                <div class="section-title">
                    Series / Seasons
                </div>


                <div
                    id="seasonList"
                    class="season-list"
                >

                    <div class="status">
                        Loading...
                    </div>

                </div>

            </div>


            <!-- EPISODES -->

            <div class="section">

                <div class="section-title">
                    Episodes
                </div>


                <div
                    id="episodeStatus"
                    class="status"
                >
                    Loading episodes...
                </div>


                <div
                    id="episodeList"
                    class="episode-list"
                ></div>


                <button
                    id="loadMoreButton"
                    class="load-more"
                    style="display:none;"
                >
                    Load More Episodes
                </button>

            </div>

        </div>
    `;


    loadSeriesEntries(anime);

    loadEpisodes(
        anime.mal_id,
        true
    );


    document
        .getElementById(
            "previousButton"
        )
        .addEventListener(
            "click",
            playPreviousEpisode
        );


    document
        .getElementById(
            "nextButton"
        )
        .addEventListener(
            "click",
            playNextEpisode
        );
}


/* ==================================================
   SERIES / SEASONS
================================================== */

function loadSeriesEntries(anime) {

    const container =
        document.getElementById(
            "seasonList"
        );


    container.innerHTML = "";


    const current =
        createSeriesButton(
            anime.mal_id,
            anime.title,
            anime.type || "Anime",
            anime.season
                ? `${anime.season} ${
                    anime.year || ""
                  }`
                : "Current entry",
            true
        );


    container.appendChild(current);


    const relations =
        anime.relations || [];


    relations.forEach(
        relation => {

            const relationName =
                relation.relation ||
                "Related";


            const entries =
                relation.entry || [];


            entries.forEach(
                entry => {

                    if (
                        entry.type !==
                        "anime"
                    ) {
                        return;
                    }


                    const button =
                        createSeriesButton(
                            entry.mal_id,
                            entry.name,
                            "Anime",
                            relationName,
                            false
                        );


                    container.appendChild(
                        button
                    );
                }
            );
        }
    );


    if (
        container.children.length === 1
    ) {

        const note =
            document.createElement(
                "div"
            );

        note.className =
            "empty";

        note.textContent =
            "No related entries listed.";

        container.appendChild(note);
    }
}


function createSeriesButton(
    id,
    title,
    type,
    relation,
    active
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "season-button";


    if (active) {
        button.classList.add(
            "active"
        );
    }


    button.innerHTML = `

        <div class="season-name">
            ${escapeHTML(title)}
        </div>

        <div class="season-type">
            ${escapeHTML(relation)}
            •
            ${escapeHTML(type)}
        </div>
    `;


    button.addEventListener(
        "click",
        () => openAnime(id)
    );


    return button;
}


/* ==================================================
   LOAD EPISODES
================================================== */

async function loadEpisodes(
    animeId,
    reset = false
) {

    if (episodeLoading) {
        return;
    }


    episodeLoading = true;


    const status =
        document.getElementById(
            "episodeStatus"
        );


    const list =
        document.getElementById(
            "episodeList"
        );


    const loadMore =
        document.getElementById(
            "loadMoreButton"
        );


    if (!status || !list) {

        episodeLoading = false;

        return;
    }


    if (reset) {

        currentEpisodePage = 1;

        currentEpisodeAnimeId =
            animeId;

        loadedEpisodes = [];

        currentEpisodeIndex = -1;

        list.innerHTML = "";

        loadMore.style.display =
            "none";

        status.textContent =
            "Loading episodes...";
    }


    try {

        const result =
            await apiFetch(
                `${API}/anime/${animeId}/episodes?page=${currentEpisodePage}`
            );


        const episodes =
            result.data || [];


        loadedEpisodes =
            loadedEpisodes.concat(
                episodes
            );


        renderEpisodes();


        if (
            result.pagination?.has_next_page
        ) {

            loadMore.style.display =
                "block";

        } else {

            loadMore.style.display =
                "none";
        }


        const total =
            currentAnime?.episodes;


        if (total) {

            status.textContent =
                `${loadedEpisodes.length} of ${total} episodes loaded.`;

        } else {

            status.textContent =
                `${loadedEpisodes.length} episodes loaded.`;
        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "Could not load episodes right now.";

    } finally {

        episodeLoading = false;
    }
}


/* ==================================================
   RENDER EPISODES
================================================== */

function renderEpisodes() {

    const list =
        document.getElementById(
            "episodeList"
        );


    if (!list) {
        return;
    }


    list.innerHTML = "";


    if (!loadedEpisodes.length) {

        list.innerHTML = `
            <div class="empty">
                No episode information available.
            </div>
        `;

        return;
    }


    loadedEpisodes.forEach(
        (episode, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "episode-card";


            const number =
                episode.mal_id;


            const title =
                episode.title ||
                `Episode ${number}`;


            const aired =
                episode.aired
                    ? formatDate(
                        episode.aired
                    )
                    : "Unknown";


            card.innerHTML = `

                <div class="episode-number">
                    EP ${escapeHTML(number)}
                </div>


                <div class="episode-info">

                    <div class="episode-title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="episode-date">
                        Aired:
                        ${escapeHTML(aired)}
                    </div>

                </div>


                <button
                    class="watch-button"
                >
                    ▶ Play
                </button>
            `;


            card
                .querySelector(
                    ".watch-button"
                )
                .addEventListener(
                    "click",
                    () => playEpisode(index)
                );


            list.appendChild(card);
        }
    );
}


/* ==================================================
   LOAD MORE BUTTON
================================================== */

document.addEventListener(
    "click",
    event => {

        if (
            event.target &&
            event.target.id ===
                "loadMoreButton"
        ) {

            currentEpisodePage++;

            loadEpisodes(
                currentEpisodeAnimeId,
                false
            );
        }
    }
);


/* ==================================================
   VIDEO SOURCE
================================================== */

function getVideoSource(
    animeId,
    episodeNumber
) {

    return (
        VIDEO_SOURCES?.[animeId]?.[
            episodeNumber
        ] || ""
    );
}


/* ==================================================
   PLAY EPISODE
================================================== */

function playEpisode(index) {

    if (
        index < 0 ||
        index >= loadedEpisodes.length
    ) {
        return;
    }


    currentEpisodeIndex =
        index;


    const episode =
        loadedEpisodes[index];


    const number =
        episode.mal_id;


    const video =
        document.getElementById(
            "m6Video"
        );


    const message =
        document.getElementById(
            "playerMessage"
        );


    const title =
        document.getElementById(
            "playerTitle"
        );


    const subtitle =
        document.getElementById(
            "playerSubtitle"
        );


    title.textContent =
        `Episode ${number}: ${
            episode.title ||
            "Untitled"
        }`;


    subtitle.textContent =
        currentAnime?.title ||
        "M6ANIME";


    const source =
        getVideoSource(
            currentEpisodeAnimeId,
            number
        );


    if (!source) {

        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();

        video.style.display =
            "none";


        message.style.display =
            "block";


        message.innerHTML = `

            🎬 Episode ${escapeHTML(number)}
            selected.

            <div class="player-note">

                This episode does not have a
                video source configured yet.

                <br><br>

                M6 Player is ready for an
                authorized video source.

            </div>
        `;


        updatePlayerButtons();

        scrollToPlayer();

        return;
    }


    message.style.display =
        "none";


    video.style.display =
        "block";


    video.src =
        source;


    video.load();


    video.play().catch(
        () => {}
    );


    updatePlayerButtons();

    scrollToPlayer();
}


/* ==================================================
   PREVIOUS
================================================== */

function playPreviousEpisode() {

    if (
        currentEpisodeIndex <= 0
    ) {
        return;
    }


    playEpisode(
        currentEpisodeIndex - 1
    );
}


/* ==================================================
   NEXT
================================================== */

function playNextEpisode() {

    if (
        currentEpisodeIndex < 0
    ) {
        return;
    }


    if (
        currentEpisodeIndex <
        loadedEpisodes.length - 1
    ) {

        playEpisode(
            currentEpisodeIndex + 1
        );

        return;
    }


    const loadMore =
        document.getElementById(
            "loadMoreButton"
        );


    if (
        loadMore &&
        loadMore.style.display !==
            "none"
    ) {

        currentEpisodePage++;

        loadEpisodes(
            currentEpisodeAnimeId,
            false
        );
    }
}


/* ==================================================
   PLAYER BUTTONS
================================================== */

function updatePlayerButtons() {

    const previous =
        document.getElementById(
            "previousButton"
        );


    const next =
        document.getElementById(
            "nextButton"
        );


    if (!previous || !next) {
        return;
    }


    previous.disabled =
        currentEpisodeIndex <= 0;


    next.disabled =
        currentEpisodeIndex < 0;
}


/* ==================================================
   SCROLL TO PLAYER
================================================== */

function scrollToPlayer() {

    const player =
        document.querySelector(
            ".player-box"
        );


    if (!player) {
        return;
    }


    player.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}


/* ==================================================
   BACK HOME
================================================== */

backButton.addEventListener(
    "click",
    () => {

        const video =
            document.getElementById(
                "m6Video"
            );


        if (video) {
            video.pause();
        }


        detailsPage.style.display =
            "none";


        homePage.style.display =
            "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }
);


/* ==================================================
   START M6ANIME
================================================== */

loadPopularAnime();

</script>

</body>
</html>
