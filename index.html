<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M6ANIME</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 32px 15px 20px;
        }

        .logo {
            color: #ff1493;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            max-width: 700px;
            margin: auto;
        }

        #searchInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #ff1493;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #searchButton,
        .pink-button {
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            background: #ff1493;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover,
        .pink-button:hover {
            background: #ff3da6;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            color: #ff1493;
        }

        .status {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 18px;
        }

        .anime-card {
            background: #111;
            border: 1px solid #242424;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            border-color: #ff1493;
        }

        .anime-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .anime-info {
            padding: 12px;
        }

        .anime-title {
            font-weight: bold;
            line-height: 1.4;
        }

        .small-info {
            color: #999;
            font-size: 13px;
            margin-top: 7px;
        }

        .score {
            color: #ffd700;
            margin-top: 7px;
        }

        .back-button {
            border: none;
            background: #ff1493;
            color: white;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .back-button:hover {
            background: #ff3da6;
        }

        .details {
            background: #101010;
            border: 1px solid #242424;
            border-radius: 15px;
            padding: 20px;
        }

        .details-top {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .details-poster {
            width: 250px;
            max-width: 100%;
            border-radius: 12px;
        }

        .details-info {
            flex: 1;
            min-width: 250px;
        }

        .details-title {
            color: #ff1493;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .meta {
            color: #ccc;
            line-height: 1.9;
        }

        .synopsis {
            color: #ddd;
            line-height: 1.7;
            margin-top: 15px;
        }

        .section {
            margin-top: 30px;
        }

        .section-title {
            color: #ff1493;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* SERIES / SEASONS */

        .season-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 10px;
        }

        .season-button {
            background: #171717;
            color: white;
            border: 1px solid #303030;
            padding: 13px;
            border-radius: 9px;
            cursor: pointer;
            text-align: left;
        }

        .season-button:hover {
            border-color: #ff1493;
        }

        .season-button.active {
            background: #ff1493;
            border-color: #ff1493;
        }

        .season-name {
            font-weight: bold;
        }

        .season-type {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        .season-button.active .season-type {
            color: white;
        }

        /* PLAYER */

        .player-box {
            background: #000;
            border: 1px solid #292929;
            border-radius: 14px;
            overflow: hidden;
        }

        .player-header {
            padding: 14px 16px;
            background: #101010;
            border-bottom: 1px solid #282828;
        }

        .player-title {
            color: white;
            font-weight: bold;
        }

        .player-subtitle {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        #m6Video {
            width: 100%;
            display: block;
            background: #000;
            max-height: 70vh;
        }

        .player-message {
            padding: 35px 20px;
            text-align: center;
            color: #888;
        }

        .player-note {
            margin-top: 12px;
            color: #666;
            font-size: 12px;
        }

        .player-controls {
            padding: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: #101010;
        }

        /* EPISODES */

        .episode-list {
            display: grid;
            gap: 10px;
        }

        .episode-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 13px;
        }

        .episode-card:hover {
            border-color: #ff1493;
        }

        .episode-number-box {
            min-width: 58px;
            text-align: center;
            color: #ff1493;
            font-weight: bold;
        }

        .episode-info {
            flex: 1;
        }

        .episode-title {
            font-weight: bold;
        }

        .episode-date {
            color: #777;
            font-size: 12px;
            margin-top: 6px;
        }

        .watch-button {
            border: none;
            background: #ff1493;
            color: white;
            border-radius: 8px;
            padding: 9px 13px;
            cursor: pointer;
            font-weight: bold;
        }

        .watch-button:hover {
            background: #ff3da6;
        }

        .load-more {
            display: block;
            margin: 20px auto;
            border: none;
            background: #ff1493;
            color: white;
            border-radius: 9px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .load-more:hover {
            background: #ff3da6;
        }

        /* STREAMING */

        .streaming {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stream-link {
            display: inline-block;
            padding: 11px 15px;
            border-radius: 8px;
            background: #222;
            color: white;
            text-decoration: none;
            border: 1px solid #333;
        }

        .stream-link:hover {
            border-color: #ff1493;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 7px;
            background: #222;
            margin: 3px;
            font-size: 13px;
        }

        .empty {
            color: #777;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 38px;
            }

            .search-box {
                flex-direction: column;
            }

            #searchButton {
                width: 100%;
            }

            .anime-card img {
                height: 220px;
            }

            .details-title {
                font-size: 25px;
            }

            .episode-card {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .watch-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">M6ANIME</div>

    <div class="search-box">
        <input
            id="searchInput"
            type="text"
            placeholder="Search anime..."
        >

        <button id="searchButton">
            Search
        </button>
    </div>
</header>

<main>

    <!-- HOME -->

    <section id="homePage">

        <h2>Popular Anime</h2>

        <div id="animeGrid" class="anime-grid"></div>

        <div id="homeStatus" class="status">
            Loading anime...
        </div>

    </section>


    <!-- DETAILS -->

    <section
        id="detailsPage"
        style="display:none;"
    >

        <button
            class="back-button"
            id="backButton"
        >
            ← Back
        </button>

        <div id="detailsContainer"></div>

    </section>

</main>


<script>

const API = "https://api.jikan.moe/v4";

/*
    Add video URLs here ONLY for videos you own
    or are authorized/licensed to stream.

    Format:

    anime MAL ID:
        episode number:
            "video URL"

    Example:

    const VIDEO_SOURCES = {
        123: {
            1: "https://your-authorized-server.example/video1.mp4",
            2: "https://your-authorized-server.example/video2.mp4"
        }
    };

    Leave it empty for now.
*/

const VIDEO_SOURCES = {};


let currentAnime = null;

let currentEpisodePage = 1;
let currentEpisodeAnimeId = null;

let loadedEpisodes = [];
let currentEpisodeIndex = -1;

let episodeLoading = false;


/* =========================
   ELEMENTS
========================= */

const homePage =
    document.getElementById("homePage");

const detailsPage =
    document.getElementById("detailsPage");

const animeGrid =
    document.getElementById("animeGrid");

const homeStatus =
    document.getElementById("homeStatus");

const searchInput =
    document.getElementById("searchInput");

const searchButton =
    document.getElementById("searchButton");

const backButton =
    document.getElementById("backButton");


/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(date) {

    if (!date) {
        return "Unknown";
    }

    const d = new Date(date);

    if (isNaN(d.getTime())) {
        return date;
    }

    return d.toLocaleDateString();
}


async function apiFetch(url) {

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            "API error: " + response.status
        );
    }

    return await response.json();
}


/* =========================
   HOME
========================= */

async function loadPopularAnime() {

    animeGrid.innerHTML = "";

    homeStatus.textContent =
        "Loading 24 anime...";

    try {

        const result = await apiFetch(
            `${API}/top/anime?limit=24`
        );

        displayAnime(
            result.data || []
        );

        homeStatus.textContent =
            "Showing 24 anime for now.";

    } catch (error) {

        console.error(error);

        homeStatus.textContent =
            "Could not load anime. Refresh and try again.";
    }
}


function displayAnime(animes) {

    animeGrid.innerHTML = "";

    if (!animes.length) {

        animeGrid.innerHTML =
            `<div class="empty">
                No anime found.
            </div>`;

        return;
    }


    animes.forEach(anime => {

        const card =
            document.createElement("div");

        card.className =
            "anime-card";


        const image =
            anime.images?.jpg?.large_image_url ||
            anime.images?.jpg?.image_url ||
            "";


        card.innerHTML = `

            <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(anime.title)}"
            >

            <div class="anime-info">

                <div class="anime-title">
                    ${escapeHTML(anime.title)}
                </div>

                <div class="small-info">
                    ${escapeHTML(anime.type || "Unknown")}
                    •
                    ${anime.episodes ?? "?"} eps
                </div>

                <div class="score">
                    ⭐ ${anime.score ?? "N/A"}
                </div>

            </div>
        `;


        card.addEventListener(
            "click",
            () => openAnime(anime.mal_id)
        );


        animeGrid.appendChild(card);
    });
}


/* =========================
   SEARCH
========================= */

async function searchAnime() {

    const query =
        searchInput.value.trim();


    if (!query) {

        loadPopularAnime();

        return;
    }


    animeGrid.innerHTML = "";

    homeStatus.textContent =
        "Searching...";


    try {

        const result = await apiFetch(
            `${API}/anime?q=${encodeURIComponent(query)}&limit=24`
        );


        displayAnime(
            result.data || []
        );


        homeStatus.textContent =
            `Results for "${query}"`;


    } catch (error) {

        console.error(error);

        homeStatus.textContent =
            "Search failed. Please try again.";
    }
}


searchButton.addEventListener(
    "click",
    searchAnime
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            searchAnime();
        }

    }
);


/* =========================
   OPEN ANIME
========================= */

async function openAnime(id) {

    homePage.style.display =
        "none";

    detailsPage.style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    document.getElementById(
        "detailsContainer"
    ).innerHTML = `

        <div class="status">
            Loading anime...
        </div>
    `;


    try {

        const result = await apiFetch(
            `${API}/anime/${id}/full`
        );


        currentAnime =
            result.data;


        loadedEpisodes = [];

        currentEpisodeIndex = -1;

        currentEpisodePage = 1;

        currentEpisodeAnimeId =
            id;


        renderAnimeDetails(
            currentAnime
        );


    } catch (error) {

        console.error(error);

        document.getElementById(
            "detailsContainer"
        ).innerHTML = `

            <div class="status">
                Could not load this anime.
            </div>
        `;
    }
}


/* =========================
   DETAILS
========================= */

function renderAnimeDetails(anime) {

    const container =
        document.getElementById(
            "detailsContainer"
        );


    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        "";


    const studios =
        anime.studios?.length
            ? anime.studios
                .map(studio =>
                    escapeHTML(studio.name)
                )
                .join(", ")
            : "Unknown";


    const genres =
        anime.genres?.length
            ? anime.genres
                .map(genre =>
                    `<span class="badge">
                        ${escapeHTML(genre.name)}
                    </span>`
                )
                .join("")
            : `<span class="empty">Unknown</span>`;


    container.innerHTML = `

        <div class="details">

            <div class="details-top">

                <img
                    class="details-poster"
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(anime.title)}"
                >


                <div class="details-info">

                    <div class="details-title">
                        ${escapeHTML(anime.title)}
                    </div>


                    <div class="meta">

                        <strong>Type:</strong>
                        ${escapeHTML(anime.type || "Unknown")}
                        <br>

                        <strong>Episodes:</strong>
                        ${anime.episodes ?? "Unknown"}
                        <br>

                        <strong>Status:</strong>
                        ${escapeHTML(anime.status || "Unknown")}
                        <br>

                        <strong>Season:</strong>
                        ${escapeHTML(anime.season || "Unknown")}
                        ${anime.year ? " " + anime.year : ""}
                        <br>

                        <strong>Score:</strong>
                        ⭐ ${anime.score ?? "N/A"}
                        <br>

                        <strong>Studio:</strong>
                        ${studios}

                    </div>


                    <div class="synopsis">

                        ${escapeHTML(
                            anime.synopsis ||
                            "No synopsis available."
                        )}

                    </div>


                    <div class="section">

                        <div class="section-title">
                            Genres
                        </div>

                        ${genres}

                    </div>

                </div>

            </div>


            <!-- PLAYER -->

            <div class="section">

                <div class="section-title">
                    M6 Player
                </div>

                <div class="player-box">

                    <div class="player-header">

                        <div
                            id="playerTitle"
                            class="player-title"
                        >
                            Select an episode
                        </div>

                        <div
                            id="playerSubtitle"
                            class="player-subtitle"
                        >
                            M6 Player
                        </div>

                    </div>


                    <video
                        id="m6Video"
                        controls
                        playsinline
                        preload="metadata"
                        style="display:none;"
                    ></video>


                    <div
                        id="playerMessage"
                        class="player-message"
                    >

                        Select an episode below.

                        <div class="player-note">
                            Video sources must be videos
                            you own or are authorized to stream.
                        </div>

                    </div>


                    <div class="player-controls">

                        <button
                            id="previousButton"
                            class="pink-button"
                        >
                            ⏮ Previous
                        </button>

                        <button
                            id="nextButton"
                            class="pink-button"
                        >
                            Next ⏭
                        </button>

                    </div>

                </div>

            </div>


            <!-- SERIES / SEASONS -->

            <div class="section">

                <div class="section-title">
                    Series / Seasons
                </div>

                <div
                    id="seasonList"
                    class="season-list"
                >

                    <div class="status">
                        Loading...
                    </div>

                </div>

            </div>


            <!-- EPISODES -->

            <div class="section">

                <div class="section-title">
                    Episodes
                </div>


                <div
                    id="episodeStatus"
                    class="status"
                >
                    Loading episodes...
                </div>


                <div
                    id="episodeList"
                    class="episode-list"
                ></div>


                <button
                    id="loadMoreButton"
                    class="load-more"
                    style="display:none;"
                >
                    Load More Episodes
                </button>

            </div>


            <!-- OFFICIAL STREAMING LINKS -->

            <div class="section">

                <div class="section-title">
                    Official Streaming Links
                </div>


                <div
                    id="streamingLinks"
                    class="streaming"
                >
                    Loading...
                </div>

            </div>

        </div>
    `;


    loadSeriesEntries(anime);

    loadEpisodes(
        anime.mal_id,
        true
    );

    loadStreaming(anime);


    document
        .getElementById("previousButton")
        .addEventListener(
            "click",
            playPreviousEpisode
        );


    document
        .getElementById("nextButton")
        .addEventListener(
            "click",
            playNextEpisode
        );
}


/* =========================
   SERIES / SEASONS
========================= */

function loadSeriesEntries(anime) {

    const container =
        document.getElementById(
            "seasonList"
        );


    container.innerHTML = "";


    /*
        Current anime
    */

    const currentButton =
        createSeriesButton(
            anime.mal_id,
            anime.title,
            anime.type || "Anime",
            anime.season
                ? `${anime.season} ${anime.year || ""}`
                : "Current entry",
            true
        );


    container.appendChild(
        currentButton
    );


    /*
        Related anime from Jikan.
        Prequels, sequels, side stories,
        parent stories, etc.
    */

    const relations =
        anime.relations || [];


    relations.forEach(
        relation => {

            const relationName =
                relation.relation ||
                "Related";


            const entries =
                relation.entry || [];


            entries.forEach(
                entry => {

                    if (
                        entry.type !== "anime"
                    ) {
                        return;
                    }


                    const button =
                        createSeriesButton(
                            entry.mal_id,
                            entry.name,
                            entry.type,
                            relationName,
                            false
                        );


                    container.appendChild(
                        button
                    );
                }
            );
        }
    );


    if (
        container.children.length === 1
    ) {

        const note =
            document.createElement("div");

        note.className =
            "empty";

        note.textContent =
            "No related entries were listed.";

        container.appendChild(note);
    }
}


function createSeriesButton(
    id,
    title,
    type,
    relation,
    active
) {

    const button =
        document.createElement("button");


    button.className =
        "season-button";


    if (active) {
        button.classList.add("active");
    }


    button.innerHTML = `

        <div class="season-name">
            ${escapeHTML(title)}
        </div>

        <div class="season-type">
            ${escapeHTML(relation)}
            •
            ${escapeHTML(type)}
        </div>
    `;


    button.addEventListener(
        "click",
        () => openAnime(id)
    );


    return button;
}


/* =========================
   EPISODES
========================= */

async function loadEpisodes(
    animeId,
    reset = false
) {

    if (episodeLoading) {
        return;
    }


    episodeLoading = true;


    const status =
        document.getElementById(
            "episodeStatus"
        );


    const list =
        document.getElementById(
            "episodeList"
        );


    const loadMore =
        document.getElementById(
            "loadMoreButton"
        );


    if (!status || !list) {

        episodeLoading = false;

        return;
    }


    if (reset) {

        currentEpisodePage = 1;

        currentEpisodeAnimeId =
            animeId;

        loadedEpisodes = [];

        currentEpisodeIndex = -1;

        list.innerHTML = "";

        loadMore.style.display =
            "none";

        status.textContent =
            "Loading episodes...";
    }


    try {

        const result =
            await apiFetch(
                `${API}/anime/${animeId}/episodes?page=${currentEpisodePage}`
            );


        const episodes =
            result.data || [];


        loadedEpisodes =
            loadedEpisodes.concat(
                episodes
            );


        renderEpisodes();


        const hasNext =
            result.pagination?.has_next_page;


        if (hasNext) {

            loadMore.style.display =
                "block";

        } else {

            loadMore.style.display =
                "none";
        }


        const total =
            currentAnime?.episodes;


        if (total) {

            status.textContent =
                `${loadedEpisodes.length} of ${total} episodes loaded.`;

        } else {

            status.textContent =
                `${loadedEpisodes.length} episodes loaded.`;
        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "Episode list could not be loaded right now.";

    } finally {

        episodeLoading = false;
    }
}


/* =========================
   RENDER EPISODES
========================= */

function renderEpisodes() {

    const list =
        document.getElementById(
            "episodeList"
        );


    if (!list) {
        return;
    }


    list.innerHTML = "";


    loadedEpisodes.forEach(
        (episode, index) => {

            const card =
                document.createElement("div");


            card.className =
                "episode-card";


            const episodeNumber =
                episode.mal_id;


            const title =
                episode.title ||
                `Episode ${episodeNumber}`;


            const aired =
                episode.aired
                    ? formatDate(
                        episode.aired
                    )
                    : "Air date unknown";


            const hasVideo =
                hasVideoSource(
                    currentEpisodeAnimeId,
                    episodeNumber
                );


            card.innerHTML = `

                <div class="episode-number-box">
                    EP ${escapeHTML(
                        episodeNumber
                    )}
                </div>


                <div class="episode-info">

                    <div class="episode-title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="episode-date">
                        Aired: ${escapeHTML(aired)}
                    </div>

                </div>


                <button
                    class="watch-button"
                    data-index="${index}"
                >
                    ${hasVideo
                        ? "▶ Watch"
                        : "▶ M6 Player"}
                </button>
            `;


            card
                .querySelector(
                    ".watch-button"
                )
                .addEventListener(
                    "click",
                    () => {

                        playEpisode(
                            index
                        );

                    }
                );


            list.appendChild(card);
        }
    );
}


/* =========================
   LOAD MORE
========================= */

document.addEventListener(
    "click",
    event => {

        if (
            event.target &&
            event.target.id ===
                "loadMoreButton"
        ) {

            currentEpisodePage++;

            loadEpisodes(
                currentEpisodeAnimeId,
                false
            );
        }

    }
);


/* =========================
   VIDEO SOURCE
========================= */

function hasVideoSource(
    animeId,
    episodeNumber
) {

    return Boolean(
        VIDEO_SOURCES?.[animeId]?.[
            episodeNumber
        ]
    );
}


function getVideoSource(
    animeId,
    episodeNumber
) {

    return (
        VIDEO_SOURCES?.[animeId]?.[
            episodeNumber
        ] || ""
    );
}


/* =========================
   M6 PLAYER
========================= */

function playEpisode(index) {

    if (
        index < 0 ||
        index >= loadedEpisodes.length
    ) {
        return;
    }


    currentEpisodeIndex =
        index;


    const episode =
        loadedEpisodes[index];


    const video =
        document.getElementById(
            "m6Video"
        );


    const message =
        document.getElementById(
            "playerMessage"
        );


    const title =
        document.getElementById(
            "playerTitle"
        );


    const subtitle =
        document.getElementById(
            "playerSubtitle"
        );


    const episodeNumber =
        episode.mal_id;


    title.textContent =
        `Episode ${episodeNumber}: ${
            episode.title ||
            "Untitled"
        }`;


    subtitle.textContent =
        currentAnime?.title ||
        "M6ANIME";


    const source =
        getVideoSource(
            currentEpisodeAnimeId,
            episodeNumber
        );


    if (!source) {

        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();

        video.style.display =
            "none";


        message.style.display =
            "block";


        message.innerHTML = `

            No video source is configured
            for this episode.

            <div class="player-note">
                Add an authorized video URL
                to VIDEO_SOURCES in the
                HTML code to play it.
            </div>
        `;


        scrollToPlayer();

        updatePlayerButtons();

        return;
    }


    message.style.display =
        "none";


    video.style.display =
        "block";


    video.src =
        source;


    video.load();


    video.play().catch(
        () => {
            /*
                Browser may block autoplay.
                The controls remain available.
            */
        }
    );


    scrollToPlayer();

    updatePlayerButtons();
}


/* =========================
   PREVIOUS
========================= */

function playPreviousEpisode() {

    if (
        currentEpisodeIndex <= 0
    ) {
        return;
    }


    playEpisode(
        currentEpisodeIndex - 1
    );
}


/* =========================
   NEXT
========================= */

function playNextEpisode() {

    if (
        currentEpisodeIndex ===
            -1
    ) {
        return;
    }


    if (
        currentEpisodeIndex <
        loadedEpisodes.length - 1
    ) {

        playEpisode(
            currentEpisodeIndex + 1
        );

        return;
    }


    /*
        At the end of the currently loaded
        page, load another page if one exists.
    */

    const loadMore =
        document.getElementById(
            "loadMoreButton"
        );


    if (
        loadMore &&
        loadMore.style.display !==
            "none"
    ) {

        currentEpisodePage++;

        loadEpisodes(
            currentEpisodeAnimeId,
            false
        );

    }
}


/* =========================
   PLAYER BUTTONS
========================= */

function updatePlayerButtons() {

    const previous =
        document.getElementById(
            "previousButton"
        );


    const next =
        document.getElementById(
            "nextButton"
        );


    if (!previous || !next) {
        return;
    }


    previous.disabled =
        currentEpisodeIndex <= 0;


    next.disabled =
        currentEpisodeIndex < 0;
}


/* =========================
   PLAYER SCROLL
========================= */

function scrollToPlayer() {

    const player =
        document.querySelector(
            ".player-box"
        );


    if (!player) {
        return;
    }


    player.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}


/* =========================
   STREAMING LINKS
========================= */

function loadStreaming(anime) {

    const container =
        document.getElementById(
            "streamingLinks"
        );


    if (!container) {
        return;
    }


    const streaming =
        anime.streaming || [];


    if (!streaming.length) {

        container.innerHTML = `

            <div class="empty">
                No official streaming links
                were listed for this anime.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    streaming.forEach(
        service => {

            if (!service.url) {
                return;
            }


            const link =
                document.createElement(
                    "a"
                );


            link.className =
                "stream-link";


            link.href =
                service.url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            link.textContent =
                service.name ||
                "Official service";


            container.appendChild(
                link
            );
        }
    );
}


/* =========================
   BACK
========================= */

backButton.addEventListener(
    "click",
    () => {

        const video =
            document.getElementById(
                "m6Video"
            );


        if (video) {
            video.pause();
        }


        detailsPage.style.display =
            "none";

        homePage.style.display =
            "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }
);


/* =========================
   START
========================= */

loadPopularAnime();

</script>
