<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M6ANIME</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #050505;
        color: white;
        font-family: Arial, sans-serif;
    }

    header {
        text-align: center;
        padding: 45px 15px 25px;
    }

    .logo {
        color: #ff4fa3;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 25px;
    }

    .search-box {
        display: flex;
        justify-content: center;
        gap: 8px;
        max-width: 700px;
        margin: auto;
    }

    #searchInput {
        flex: 1;
        padding: 15px 18px;
        border-radius: 12px;
        border: 1px solid #333;
        background: #151515;
        color: white;
        font-size: 16px;
        outline: none;
    }

    #searchInput:focus {
        border-color: #ff4fa3;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        background: #ff4fa3;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
    }

    .section-title {
        font-size: 25px;
        margin: 20px 0;
    }

    #status {
        text-align: center;
        color: #aaa;
        margin: 20px;
    }

    .anime-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 20px;
    }

    .anime-card {
        background: #111;
        border: 1px solid #242424;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s;
    }

    .anime-card:hover {
        transform: translateY(-5px);
        border-color: #ff4fa3;
    }

    .anime-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
    }

    .anime-info {
        padding: 12px;
    }

    .anime-title {
        font-weight: bold;
        font-size: 15px;
        line-height: 1.3;
    }

    .anime-meta {
        color: #aaa;
        font-size: 13px;
        margin-top: 8px;
    }

    #details {
        display: none;
        margin-top: 30px;
        background: #101010;
        border: 1px solid #292929;
        border-radius: 15px;
        padding: 25px;
    }

    .details-top {
        display: flex;
        gap: 25px;
    }

    .details-top img {
        width: 230px;
        max-height: 330px;
        object-fit: cover;
        border-radius: 12px;
    }

    .details-info {
        flex: 1;
    }

    .details-info h1 {
        margin-top: 0;
        color: #ff4fa3;
    }

    .info-line {
        margin: 8px 0;
        color: #ddd;
    }

    .synopsis {
        line-height: 1.6;
        color: #ccc;
        margin-top: 18px;
    }

    .tag {
        display: inline-block;
        background: #222;
        border-radius: 20px;
        padding: 7px 12px;
        margin: 4px;
        color: #ff8bc4;
        font-size: 13px;
    }

    .episode-section {
        margin-top: 35px;
    }

    .episode-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
        margin-top: 15px;
    }

    .episode {
        background: #181818;
        border: 1px solid #292929;
        border-radius: 10px;
        padding: 14px;
    }

    .episode-number {
        color: #ff4fa3;
        font-weight: bold;
    }

    .episode-title {
        margin-top: 6px;
        color: #ddd;
    }

    .episode-date {
        color: #888;
        font-size: 12px;
        margin-top: 6px;
    }

    .season-section {
        margin-top: 35px;
    }

    .season-card {
        background: #181818;
        border: 1px solid #292929;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 10px;
    }

    .season-card a {
        color: #ff4fa3;
        text-decoration: none;
        font-weight: bold;
    }

    .streaming {
        margin-top: 25px;
    }

    .streaming a {
        display: inline-block;
        margin: 5px;
        color: white;
        background: #222;
        padding: 10px 14px;
        border-radius: 8px;
        text-decoration: none;
    }

    .streaming a:hover {
        background: #ff4fa3;
    }

    .back-button {
        margin-bottom: 20px;
        background: #222;
    }

    .load-more {
        display: block;
        margin: 20px auto;
    }

    @media (max-width: 650px) {

        .logo {
            font-size: 38px;
        }

        .search-box {
            flex-direction: column;
        }

        .details-top {
            flex-direction: column;
        }

        .details-top img {
            width: 180px;
        }
    }
</style>
</head>

<body>

<header>

    <div class="logo">
        M6ANIME
    </div>

    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="Search anime..."
            autocomplete="off"
        >

        <button onclick="searchAnime()">
            Search
        </button>

    </div>

</header>


<div class="container">

    <div id="status">
        Loading popular anime...
    </div>

    <section id="resultsSection">

        <h2 class="section-title">
            Popular Anime
        </h2>

        <div id="results" class="anime-grid"></div>

    </section>


    <section id="details">

        <button class="back-button" onclick="closeDetails()">
            ← Back
        </button>

        <div id="detailsContent"></div>

    </section>

</div>


<script>

const API = "https://api.jikan.moe/v4";

let currentAnimeId = null;
let currentEpisodePage = 1;
let totalEpisodePages = 1;


/* ---------------------------
   HTML SAFETY
--------------------------- */

function escapeHTML(text) {

    if (text === null || text === undefined) {
        return "";
    }

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ---------------------------
   API REQUEST
--------------------------- */

async function api(url) {

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("API request failed: " + response.status);
    }

    return await response.json();
}


/* ---------------------------
   LOAD POPULAR
--------------------------- */

async function loadPopular() {

    try {

        document.getElementById("status").textContent =
            "Loading popular anime...";

        const data = await api(
            `${API}/top/anime?limit=24`
        );

        displayAnime(data.data);

        document.getElementById("status").textContent = "";

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "Could not load anime. Please try again.";

    }
}


/* ---------------------------
   SEARCH
--------------------------- */

async function searchAnime() {

    const query =
        document.getElementById("searchInput").value.trim();

    if (!query) {
        loadPopular();
        return;
    }

    try {

        document.getElementById("status").textContent =
            "Searching...";

        const data = await api(
            `${API}/anime?q=${encodeURIComponent(query)}&limit=24`
        );

        displayAnime(data.data);

        document.getElementById("status").textContent =
            `${data.data.length} results`;

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "Search failed. Please try again.";

    }
}


/* ---------------------------
   ENTER KEY SEARCH
--------------------------- */

document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            searchAnime();
        }

    });


/* ---------------------------
   DISPLAY CARDS
--------------------------- */

function displayAnime(animeList) {

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    animeList.forEach(anime => {

        const card =
            document.createElement("div");

        card.className = "anime-card";

        const image =
            anime.images?.jpg?.large_image_url ||
            anime.images?.jpg?.image_url ||
            "";

        const title =
            anime.title ||
            "Unknown title";

        const type =
            anime.type ||
            "Unknown";

        const episodes =
            anime.episodes ??
            "?";

        const score =
            anime.score ??
            "N/A";

        card.innerHTML = `

            <img
                src="${image}"
                alt="${escapeHTML(title)}"
                loading="lazy"
            >

            <div class="anime-info">

                <div class="anime-title">
                    ${escapeHTML(title)}
                </div>

                <div class="anime-meta">
                    ${escapeHTML(type)}
                    •
                    ${episodes} eps
                </div>

                <div class="anime-meta">
                    ⭐ ${score}
                </div>

            </div>

        `;

        card.onclick = function() {
            openAnime(anime.mal_id);
        };

        results.appendChild(card);

    });
}


/* ---------------------------
   OPEN ANIME
--------------------------- */

async function openAnime(id) {

    currentAnimeId = id;
    currentEpisodePage = 1;

    document.getElementById("resultsSection").style.display =
        "none";

    document.getElementById("details").style.display =
        "block";

    document.getElementById("detailsContent").innerHTML =
        "<p>Loading anime details...</p>";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    try {

        const result =
            await api(`${API}/anime/${id}/full`);

        const anime =
            result.data;

        displayDetails(anime);

        await loadEpisodes(id, 1);

    } catch (error) {

        console.error(error);

        document.getElementById("detailsContent").innerHTML = `
            <p>
                Could not load this anime.
                Please try again.
            </p>
        `;

    }
}


/* ---------------------------
   DISPLAY DETAILS
--------------------------- */

function displayDetails(anime) {

    const title =
        anime.title || "Unknown";

    const englishTitle =
        anime.title_english || "";

    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        "";

    const synopsis =
        anime.synopsis ||
        "No synopsis available.";

    const score =
        anime.score ??
        "N/A";

    const episodes =
        anime.episodes ??
        "Unknown";

    const type =
        anime.type ||
        "Unknown";

    const status =
        anime.status ||
        "Unknown";

    const year =
        anime.year ||
        anime.aired?.prop?.from?.year ||
        "Unknown";

    const studios =
        anime.studios
            ?.map(studio => studio.name)
            .join(", ") ||
        "Unknown";

    let genresHTML = "";

    if (anime.genres) {

        genresHTML =
            anime.genres
                .map(g =>
                    `<span class="tag">
                        ${escapeHTML(g.name)}
                    </span>`
                )
                .join("");

    }


    document.getElementById("detailsContent").innerHTML = `

        <div class="details-top">

            <img
                src="${image}"
                alt="${escapeHTML(title)}"
            >

            <div class="details-info">

                <h1>
                    ${escapeHTML(title)}
                </h1>

                ${
                    englishTitle
                    ? `<div class="info-line">
                        English title:
                        ${escapeHTML(englishTitle)}
                       </div>`
                    : ""
                }

                <div class="info-line">
                    ⭐ Score: ${score}
                </div>

                <div class="info-line">
                    🎬 Type: ${escapeHTML(type)}
                </div>

                <div class="info-line">
                    📺 Episodes: ${episodes}
                </div>

                <div class="info-line">
                    📅 Year: ${year}
                </div>

                <div class="info-line">
                    📌 Status: ${escapeHTML(status)}
                </div>

                <div class="info-line">
                    🏢 Studio: ${escapeHTML(studios)}
                </div>

                <div>
                    ${genresHTML}
                </div>

            </div>

        </div>


        <div class="synopsis">

            <h2>Synopsis</h2>

            ${escapeHTML(synopsis)}

        </div>


        <div class="episode-section">

            <h2>
                📺 Episodes
            </h2>

            <div id="episodeStatus">
                Loading episodes...
            </div>

            <div
                id="episodes"
                class="episode-grid"
            ></div>

            <button
                id="loadMoreButton"
                class="load-more"
                style="display:none"
                onclick="loadMoreEpisodes()"
            >
                Load more episodes
            </button>

        </div>


        <div class="season-section">

            <h2>
                📚 Seasons / Related entries
            </h2>

            <div id="seasons">
                Loading seasons...
            </div>

        </div>


        <div class="streaming">

            <h2>
                🔗 Official streaming
            </h2>

            <div id="streamingLinks">
                Checking available official links...
            </div>

        </div>

    `;


    loadSeasons(anime);
    loadStreaming(anime);
}


/* ---------------------------
   LOAD EPISODES
--------------------------- */

async function loadEpisodes(id, page) {

    try {

        document.getElementById("episodeStatus").textContent =
            "Loading episodes...";

        const result =
            await api(
                `${API}/anime/${id}/episodes?page=${page}`
            );

        const episodes =
            result.data || [];

        const pagination =
            result.pagination || {};

        totalEpisodePages =
            pagination.last_visible_page || 1;

        const container =
            document.getElementById("episodes");

        if (page === 1) {
            container.innerHTML = "";
        }

        if (episodes.length === 0) {

            if (page === 1) {

                container.innerHTML =
                    "<p>No episode information available.</p>";

            }

        } else {

            episodes.forEach(ep => {

                const div =
                    document.createElement("div");

                div.className = "episode";

                const title =
                    ep.title ||
                    "Untitled episode";

                const aired =
                    ep.aired
                        ? new Date(ep.aired)
                            .toLocaleDateString()
                        : "Date unknown";

                div.innerHTML = `

                    <div class="episode-number">
                        Episode ${ep.mal_id}
                    </div>

                    <div class="episode-title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="episode-date">
                        ${aired}
                    </div>

                `;

                container.appendChild(div);

            });

        }


        document.getElementById("episodeStatus").textContent =
            `Showing episode page ${page} of ${totalEpisodePages}.`;


        const button =
            document.getElementById("loadMoreButton");

        if (page < totalEpisodePages) {

            button.style.display = "block";

        } else {

            button.style.display = "none";

        }

    } catch (error) {

        console.error(error);

        document.getElementById("episodeStatus").textContent =
            "Episodes could not be loaded right now.";

    }
}


/* ---------------------------
   LOAD MORE EPISODES
--------------------------- */

async function loadMoreEpisodes() {

    if (currentEpisodePage >= totalEpisodePages) {
        return;
    }

    currentEpisodePage++;

    await loadEpisodes(
        currentAnimeId,
        currentEpisodePage
    );

}


/* ---------------------------
   SEASONS
--------------------------- */

function loadSeasons(anime) {

    const container =
        document.getElementById("seasons");

    const relations =
        anime.relations || [];

    let seasons = [];

    /*
       Jikan gives related anime.
       Sequels are useful for showing
       the continuation/next season.
    */

    relations.forEach(relation => {

        if (
            relation.relation === "Sequel" ||
            relation.relation === "Prequel"
        ) {

            relation.entry.forEach(entry => {

                if (entry.type === "anime") {

                    seasons.push({
                        name: entry.name,
                        url: entry.url,
                        relation: relation.relation
                    });

                }

            });

        }

    });


    if (seasons.length === 0) {

        container.innerHTML = `
            <div class="season-card">
                No related seasons were found.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    seasons.forEach((season, index) => {

        const div =
            document.createElement("div");

        div.className =
            "season-card";

        div.innerHTML = `

            <div>
                <span class="episode-number">
                    ${escapeHTML(season.relation)}
                </span>
            </div>

            <div style="margin-top:8px;">
                <a
                    href="${season.url}"
                    target="_blank"
                    rel="noopener"
                >
                    ${escapeHTML(season.name)}
                </a>
            </div>

        `;

        container.appendChild(div);

    });

}


/* ---------------------------
   OFFICIAL STREAMING
--------------------------- */

function loadStreaming(anime) {

    const container =
        document.getElementById("streamingLinks");

    const streaming =
        anime.streaming || [];


    if (streaming.length === 0) {

        container.innerHTML = `
            <p style="color:#888;">
                No official streaming links were
                provided by the API for this title.
            </p>
        `;

        return;
    }


    container.innerHTML = "";


    streaming.forEach(service => {

        const a =
            document.createElement("a");

        a.href =
            service.url;

        a.target =
            "_blank";

        a.rel =
            "noopener noreferrer";

        a.textContent =
            service.name;

        container.appendChild(a);

    });

}


/* ---------------------------
   CLOSE DETAILS
--------------------------- */

function closeDetails() {

    document.getElementById("details").style.display =
        "none";

    document.getElementById("resultsSection").style.display =
        "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ---------------------------
   START WEBSITE
--------------------------- */

loadPopular();

</script>

</body>
</html>
