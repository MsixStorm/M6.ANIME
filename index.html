<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M6ANIME</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 35px 15px 20px;
        }

        .logo {
            color: #ff1493;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 8px;
            max-width: 700px;
            margin: auto;
        }

        #searchInput {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ff1493;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #searchButton {
            padding: 15px 22px;
            border: none;
            border-radius: 10px;
            background: #ff1493;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:hover {
            background: #ff3da6;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            color: #ff1493;
            margin-top: 25px;
        }

        .status {
            text-align: center;
            color: #aaa;
            margin: 25px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 18px;
        }

        .anime-card {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #222;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.35);
        }

        .anime-card img {
            width: 100%;
            height: 245px;
            object-fit: cover;
            display: block;
        }

        .anime-info {
            padding: 12px;
        }

        .anime-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .small-info {
            color: #aaa;
            font-size: 13px;
        }

        .score {
            color: #ffd700;
            margin-top: 5px;
        }

        .back-button {
            background: #ff1493;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .back-button:hover {
            background: #ff3da6;
        }

        .details {
            background: #111;
            border: 1px solid #222;
            border-radius: 15px;
            padding: 20px;
        }

        .details-top {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .details-poster {
            width: 250px;
            max-width: 100%;
            border-radius: 12px;
        }

        .details-info {
            flex: 1;
            min-width: 250px;
        }

        .details-title {
            color: #ff1493;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .meta {
            color: #ccc;
            line-height: 1.8;
        }

        .synopsis {
            color: #ddd;
            line-height: 1.7;
            margin-top: 15px;
        }

        .section {
            margin-top: 30px;
        }

        .section-title {
            color: #ff1493;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* SEASONS */

        .season-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .season-button {
            background: #181818;
            color: white;
            border: 1px solid #333;
            padding: 12px 15px;
            border-radius: 9px;
            cursor: pointer;
            text-align: left;
        }

        .season-button:hover {
            border-color: #ff1493;
        }

        .season-button.active {
            background: #ff1493;
            border-color: #ff1493;
        }

        .season-name {
            font-weight: bold;
        }

        .season-type {
            font-size: 12px;
            color: #bbb;
            margin-top: 4px;
        }

        .season-button.active .season-type {
            color: white;
        }

        /* EPISODES */

        .episode-list {
            display: grid;
            gap: 10px;
        }

        .episode-card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 15px;
        }

        .episode-number {
            color: #ff1493;
            font-weight: bold;
            font-size: 17px;
        }

        .episode-title {
            margin-top: 5px;
            font-weight: bold;
        }

        .episode-date {
            color: #888;
            font-size: 13px;
            margin-top: 7px;
        }

        .load-more {
            display: block;
            margin: 20px auto;
            background: #ff1493;
            color: white;
            border: none;
            padding: 13px 20px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .load-more:hover {
            background: #ff3da6;
        }

        .streaming {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stream-link {
            display: inline-block;
            background: #222;
            color: white;
            text-decoration: none;
            padding: 11px 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .stream-link:hover {
            border-color: #ff1493;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 6px;
            background: #222;
            margin: 3px;
            font-size: 13px;
        }

        .empty {
            color: #888;
            padding: 15px 0;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 38px;
            }

            .search-box {
                flex-direction: column;
            }

            #searchButton {
                width: 100%;
            }

            .anime-card img {
                height: 220px;
            }

            .details-title {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">M6ANIME</div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search anime..."
        >

        <button id="searchButton">
            Search
        </button>
    </div>
</header>

<main>

    <div id="homePage">
        <h2>Popular Anime</h2>

        <div id="animeGrid" class="anime-grid"></div>

        <div id="homeStatus" class="status">
            Loading anime...
        </div>
    </div>


    <div id="detailsPage" style="display:none;">

        <button class="back-button" onclick="showHome()">
            ← Back
        </button>

        <div id="detailsContainer"></div>

    </div>

</main>


<script>

const API = "https://api.jikan.moe/v4";

const homePage = document.getElementById("homePage");
const detailsPage = document.getElementById("detailsPage");
const animeGrid = document.getElementById("animeGrid");
const homeStatus = document.getElementById("homeStatus");
const searchInput = document.getElementById("searchInput");
const searchButton = document.getElementById("searchButton");

let currentAnime = null;
let currentEpisodePage = 1;
let currentEpisodeAnimeId = null;
let currentEpisodeLoading = false;


/* =========================
   HELPERS
========================= */

function escapeHTML(text) {
    if (text === null || text === undefined) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(date) {
    if (!date) {
        return "Unknown";
    }

    const d = new Date(date);

    if (isNaN(d.getTime())) {
        return date;
    }

    return d.toLocaleDateString();
}


function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}


/* =========================
   API
========================= */

async function apiFetch(url) {

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            "API error: " + response.status
        );
    }

    return await response.json();
}


/* =========================
   HOME
========================= */

async function loadPopularAnime() {

    homeStatus.textContent = "Loading anime...";
    animeGrid.innerHTML = "";

    try {

        const data = await apiFetch(
            `${API}/top/anime?limit=24`
        );

        displayAnime(data.data || []);

        homeStatus.textContent =
            "Showing 24 anime for now.";

    } catch (error) {

        console.error(error);

        homeStatus.textContent =
            "Could not load anime. Please refresh the page.";
    }
}


function displayAnime(animes) {

    animeGrid.innerHTML = "";

    if (!animes.length) {

        animeGrid.innerHTML =
            `<div class="empty">No anime found.</div>`;

        return;
    }

    animes.forEach(anime => {

        const image =
            anime.images?.jpg?.large_image_url ||
            anime.images?.jpg?.image_url ||
            "";

        const card = document.createElement("div");

        card.className = "anime-card";

        card.innerHTML = `
            <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(anime.title)}"
            >

            <div class="anime-info">

                <div class="anime-title">
                    ${escapeHTML(anime.title)}
                </div>

                <div class="small-info">
                    ${escapeHTML(anime.type || "Unknown")}
                    •
                    ${anime.episodes ?? "?"} episodes
                </div>

                <div class="score">
                    ⭐ ${anime.score ?? "N/A"}
                </div>

            </div>
        `;

        card.addEventListener(
            "click",
            () => openAnime(anime.mal_id)
        );

        animeGrid.appendChild(card);
    });
}


/* =========================
   SEARCH
========================= */

async function searchAnime() {

    const query = searchInput.value.trim();

    if (!query) {
        loadPopularAnime();
        return;
    }

    homeStatus.textContent = "Searching...";
    animeGrid.innerHTML = "";

    try {

        const data = await apiFetch(
            `${API}/anime?q=${encodeURIComponent(query)}&limit=24`
        );

        displayAnime(data.data || []);

        homeStatus.textContent =
            `Search results for "${query}"`;

    } catch (error) {

        console.error(error);

        homeStatus.textContent =
            "Search failed. Please try again.";
    }
}


searchButton.addEventListener(
    "click",
    searchAnime
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            searchAnime();
        }

    }
);


/* =========================
   OPEN ANIME
========================= */

async function openAnime(id) {

    homePage.style.display = "none";
    detailsPage.style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    document.getElementById("detailsContainer").innerHTML = `
        <div class="status">
            Loading anime details...
        </div>
    `;

    try {

        const result = await apiFetch(
            `${API}/anime/${id}/full`
        );

        currentAnime = result.data;

        renderAnimeDetails(currentAnime);

    } catch (error) {

        console.error(error);

        document.getElementById("detailsContainer").innerHTML = `
            <div class="status">
                Could not load anime details.
            </div>
        `;
    }
}


/* =========================
   ANIME DETAILS
========================= */

function renderAnimeDetails(anime) {

    const container =
        document.getElementById("detailsContainer");

    const image =
        anime.images?.jpg?.large_image_url ||
        anime.images?.jpg?.image_url ||
        "";

    const synopsis =
        anime.synopsis ||
        "No synopsis available.";

    const premiered =
        anime.premiered ||
        "Unknown";

    const studios =
        anime.studios?.length
            ? anime.studios
                .map(s => escapeHTML(s.name))
                .join(", ")
            : "Unknown";

    const genres =
        anime.genres?.length
            ? anime.genres
                .map(g =>
                    `<span class="badge">
                        ${escapeHTML(g.name)}
                    </span>`
                )
                .join("")
            : `<span class="empty">Unknown</span>`;


    container.innerHTML = `

        <div class="details">

            <div class="details-top">

                <img
                    class="details-poster"
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(anime.title)}"
                >

                <div class="details-info">

                    <div class="details-title">
                        ${escapeHTML(anime.title)}
                    </div>

                    <div class="meta">

                        <strong>Type:</strong>
                        ${escapeHTML(anime.type || "Unknown")}
                        <br>

                        <strong>Episodes:</strong>
                        ${anime.episodes ?? "Unknown"}
                        <br>

                        <strong>Status:</strong>
                        ${escapeHTML(anime.status || "Unknown")}
                        <br>

                        <strong>Premiered:</strong>
                        ${escapeHTML(premiered)}
                        <br>

                        <strong>Score:</strong>
                        ⭐ ${anime.score ?? "N/A"}
                        <br>

                        <strong>Studio:</strong>
                        ${studios}

                    </div>

                    <div class="synopsis">
                        ${escapeHTML(synopsis)}
                    </div>

                    <div class="section">

                        <div class="section-title">
                            Genres
                        </div>

                        ${genres}

                    </div>

                </div>

            </div>


            <!-- SEASONS -->

            <div class="section">

                <div class="section-title">
                    Seasons / Related Entries
                </div>

                <div id="seasonList" class="season-list">

                    <div class="status">
                        Loading seasons...
                    </div>

                </div>

            </div>


            <!-- EPISODES -->

            <div class="section">

                <div class="section-title">
                    Episodes
                </div>

                <div id="episodeStatus" class="status">
                    Loading episodes...
                </div>

                <div id="episodeList" class="episode-list"></div>

                <button
                    id="loadMoreButton"
                    class="load-more"
                    style="display:none;"
                >
                    Load More Episodes
                </button>

            </div>


            <!-- STREAMING -->

            <div class="section">

                <div class="section-title">
                    Official Streaming
                </div>

                <div id="streamingLinks"
                     class="streaming">

                    Loading official links...

                </div>

            </div>

        </div>
    `;


    loadSeasons(anime);

    loadEpisodes(anime.mal_id, true);

    loadStreaming(anime);
}


/* =========================
   SEASONS / RELATED
========================= */

async function loadSeasons(anime) {

    const seasonList =
        document.getElementById("seasonList");

    if (!seasonList) {
        return;
    }

    /*
        The API gives us the actual premiered season/year
        and related entries such as prequels and sequels.

        We do NOT blindly call every related entry a season.
        Movies, OVAs and specials remain separate.
    */

    const entries = [];

    entries.push({
        id: anime.mal_id,
        title: anime.title,
        type: anime.type,
        relation: "Current entry",
        aired: anime.aired?.from || null,
        premiered: anime.premiered || ""
    });


    const related =
        anime.relations || [];


    for (const relation of related) {

        const relationName =
            relation.relation || "Related";

        const entriesList =
            relation.entry || [];


        for (const item of entriesList) {

            if (!item.mal_id) {
                continue;
            }

            /*
                Only anime entries.
                Manga/people/etc. are ignored.
            */

            if (item.type !== "anime") {
                continue;
            }


            /*
                Prequel and sequel are the most useful
                entries for determining series order.
            */

            if (
                relationName === "Prequel" ||
                relationName === "Sequel" ||
                relationName === "Parent story" ||
                relationName === "Side story"
            ) {

                if (
                    !entries.some(
                        e => e.id === item.mal_id
                    )
                ) {

                    entries.push({
                        id: item.mal_id,
                        title: item.name,
                        type: "Unknown",
                        relation: relationName,
                        aired: null,
                        premiered: ""
                    });

                }

            }
        }
    }


    /*
        Fetch extra information for related entries
        so we can display the correct type/year.
    */

    const extraEntries = [];

    for (const entry of entries) {

        if (entry.id === anime.mal_id) {

            extraEntries.push(entry);
            continue;
        }

        try {

            await delay(250);

            const result = await apiFetch(
                `${API}/anime/${entry.id}`
            );

            const data = result.data;

            extraEntries.push({
                ...entry,
                type: data.type || entry.type,
                aired: data.aired?.from || entry.aired,
                premiered: data.premiered || entry.premiered
            });

        } catch (error) {

            console.log(
                "Could not load related anime:",
                entry.id
            );

            extraEntries.push(entry);
        }
    }


    /*
        Sort TV entries chronologically.
        Other formats stay after TV entries.
    */

    extraEntries.sort((a, b) => {

        const aTV = a.type === "TV" ? 0 : 1;
        const bTV = b.type === "TV" ? 0 : 1;

        if (aTV !== bTV) {
            return aTV - bTV;
        }

        const aDate =
            a.aired
                ? new Date(a.aired).getTime()
                : Infinity;

        const bDate =
            b.aired
                ? new Date(b.aired).getTime()
                : Infinity;

        return aDate - bDate;
    });


    seasonList.innerHTML = "";


    if (!extraEntries.length) {

        seasonList.innerHTML =
            `<div class="empty">
                No related seasons or entries found.
            </div>`;

        return;
    }


    extraEntries.forEach((entry, index) => {

        const button =
            document.createElement("button");

        button.className =
            "season-button";


        if (entry.id === anime.mal_id) {
            button.classList.add("active");
        }


        let label = entry.relation;

        /*
            If it's a TV entry, display it as a series/season entry.
            We don't invent a season number.
        */

        if (entry.type === "TV") {

            if (entry.id === anime.mal_id) {
                label = "Current TV entry";
            } else if (entry.relation === "Sequel") {
                label = "Sequel";
            } else if (entry.relation === "Prequel") {
                label = "Prequel";
            }

        }


        button.innerHTML = `
            <div class="season-name">
                ${escapeHTML(entry.title)}
            </div>

            <div class="season-type">
                ${escapeHTML(label)}
                ${entry.type !== "Unknown"
                    ? " • " + escapeHTML(entry.type)
                    : ""}
                ${entry.premiered
                    ? " • " + escapeHTML(entry.premiered)
                    : ""}
            </div>
        `;


        button.addEventListener(
            "click",
            () => {

                if (entry.id === anime.mal_id) {

                    loadEpisodes(
                        entry.id,
                        true
                    );

                    document
                        .querySelectorAll(".season-button")
                        .forEach(b =>
                            b.classList.remove("active")
                        );

                    button.classList.add("active");

                    return;
                }


                openAnime(entry.id);

            }
        );


        seasonList.appendChild(button);
    });
}


/* =========================
   EPISODES
========================= */

async function loadEpisodes(
    animeId,
    reset = false
) {

    if (currentEpisodeLoading) {
        return;
    }

    currentEpisodeLoading = true;


    if (reset) {

        currentEpisodePage = 1;
        currentEpisodeAnimeId = animeId;

        const episodeList =
            document.getElementById("episodeList");

        const episodeStatus =
            document.getElementById("episodeStatus");

        const loadMoreButton =
            document.getElementById("loadMoreButton");


        if (episodeList) {
            episodeList.innerHTML = "";
        }

        if (episodeStatus) {
            episodeStatus.textContent =
                "Loading episodes...";
        }

        if (loadMoreButton) {
            loadMoreButton.style.display =
                "none";
        }
    }


    try {

        const result = await apiFetch(
            `${API}/anime/${animeId}/episodes?page=${currentEpisodePage}`
        );

        const episodes =
            result.data || [];

        const pagination =
            result.pagination || {};


        renderEpisodes(episodes);


        const episodeStatus =
            document.getElementById("episodeStatus");

        const loadMoreButton =
            document.getElementById("loadMoreButton");


        if (episodeStatus) {

            const total =
                currentAnime?.mal_id === animeId
                    ? currentAnime.episodes
                    : null;

            if (total) {

                episodeStatus.textContent =
                    `Showing episodes loaded so far. Total episodes: ${total}`;

            } else {

                episodeStatus.textContent =
                    "Episode information from the anime database.";

            }
        }


        if (
            loadMoreButton &&
            pagination.has_next_page
        ) {

            loadMoreButton.style.display =
                "block";

        } else if (loadMoreButton) {

            loadMoreButton.style.display =
                "none";
        }


    } catch (error) {

        console.error(error);

        const episodeStatus =
            document.getElementById("episodeStatus");

        if (episodeStatus) {

            episodeStatus.innerHTML = `
                Could not load the episode list right now.
                Please try again.
            `;
        }

    } finally {

        currentEpisodeLoading = false;
    }
}


/* =========================
   RENDER EPISODES
========================= */

function renderEpisodes(episodes) {

    const episodeList =
        document.getElementById("episodeList");

    if (!episodeList) {
        return;
    }


    if (!episodes.length) {

        if (!episodeList.innerHTML) {

            episodeList.innerHTML = `
                <div class="empty">
                    No episode information is available
                    for this anime.
                </div>
            `;
        }

        return;
    }


    episodes.forEach(episode => {

        const card =
            document.createElement("div");

        card.className =
            "episode-card";


        const number =
            episode.mal_id ??
            episode.mal_id === 0
                ? episode.mal_id
                : episode.episode;


        const title =
            episode.title ||
            "Untitled episode";


        const aired =
            episode.aired
                ? formatDate(episode.aired)
                : "Air date unknown";


        card.innerHTML = `

            <div class="episode-number">
                Episode ${escapeHTML(number)}
            </div>

            <div class="episode-title">
                ${escapeHTML(title)}
            </div>

            <div class="episode-date">
                Aired: ${escapeHTML(aired)}
            </div>

        `;


        episodeList.appendChild(card);
    });
}


/* =========================
   LOAD MORE
========================= */

document.addEventListener(
    "click",
    event => {

        if (
            event.target &&
            event.target.id === "loadMoreButton"
        ) {

            currentEpisodePage++;

            loadEpisodes(
                currentEpisodeAnimeId,
                false
            );
        }

    }
);


/* =========================
   STREAMING
========================= */

function loadStreaming(anime) {

    const container =
        document.getElementById("streamingLinks");

    if (!container) {
        return;
    }


    const streaming =
        anime.streaming || [];


    if (!streaming.length) {

        container.innerHTML = `
            <div class="empty">
                No official streaming links were
                provided by the anime database.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    streaming.forEach(service => {

        if (!service.url) {
            return;
        }


        const link =
            document.createElement("a");

        link.className =
            "stream-link";

        link.href =
            service.url;

        link.target =
            "_blank";

        link.rel =
            "noopener noreferrer";

        link.textContent =
            service.name || "Official streaming";


        container.appendChild(link);
    });


    if (!container.innerHTML) {

        container.innerHTML = `
            <div class="empty">

}
